<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Contribution Blaster | Standalone Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .font-arcade { font-family: 'Press Start 2P', monospace; }
        @keyframes energy-pulse {
            0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 4px #38bdf8); }
            50% { opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
        }
        .animate-pulse-glow { animation: energy-pulse 2s infinite ease-in-out; }
        .blaster-recoil {
            transform-origin: center bottom;
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .recoil-active { transform: scale(0.92, 1.15) translateY(12px) !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

    <div class="w-full max-w-4xl bg-slate-900 border-2 border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
        
        <!-- Header & HUD -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="font-arcade text-emerald-400 text-sm md:text-base tracking-wider flex items-center gap-2">
                    <span>👾</span> GITHUB CONTRIBUTION BLASTER
                </h1>
                <p class="text-xs text-slate-400 mt-1">Aim cursor and blast gray tiles into green commits!</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div class="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-xs font-mono flex items-center gap-3">
                    <span class="text-emerald-400 font-bold" id="blaster-total-commits">522 Commits</span>
                    <span class="text-slate-600">|</span>
                    <span>SCORE: <strong id="blaster-score" class="text-emerald-400">0</strong></span>
                    <span class="text-slate-600">|</span>
                    <span>STREAK: <strong id="blaster-streak" class="text-cyan-400">0</strong>🔥</span>
                </div>
                <button id="replay-timeline-btn" class="bg-purple-700 hover:bg-purple-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg border border-purple-500 shadow-md shadow-purple-500/20 transition-all flex items-center gap-1 active:scale-95">
                    ⏱️ REPLAY
                </button>
                <button id="nuke-strike-btn" class="bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white font-bold text-xs px-3 py-1.5 rounded-lg border border-red-500 shadow-md shadow-red-500/30 transition-all flex items-center gap-1 active:scale-95">
                    🚀 TACTICAL NUKE
                </button>
                <button id="auto-blast-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-emerald-500 transition-all flex items-center gap-1">
                    ⚡ AUTO-LOOP: ON
                </button>
                <button id="sound-toggle-btn" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-2.5 py-1.5 rounded-lg border border-slate-700">
                    🔊
                </button>
            </div>
        </div>

        <!-- Arcade Viewport -->
        <div id="blaster-container" class="relative w-full h-[440px] bg-slate-950/80 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between p-4 cursor-crosshair select-none">
            
            <!-- Hover Tooltip -->
            <div id="blaster-tooltip" class="absolute z-30 pointer-events-none -translate-x-1/2 bg-slate-950/95 border border-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg shadow-xl backdrop-blur-md opacity-0 transition-opacity duration-150 whitespace-nowrap"></div>

            <canvas id="blaster-canvas" class="absolute inset-0 z-20 pointer-events-none"></canvas>

            <!-- Heatmap -->
            <div class="relative z-10 w-full flex flex-col items-center">
                <div id="heatmap-grid" class="flex gap-1.5 p-3 rounded-xl bg-slate-900/90 border border-slate-800/80 shadow-inner overflow-x-auto max-w-full"></div>
            </div>

            <!-- Launcher -->
            <div class="relative z-10 w-full flex flex-col items-center justify-end">
                <div class="relative w-24 h-24 flex items-center justify-center pointer-events-none">
                    <svg id="blaster-gun" class="blaster-recoil w-20 h-20" viewBox="0 0 100 100" fill="none">
                        <ellipse cx="50" cy="88" rx="28" ry="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
                        <path d="M42 85 L44 65 L56 65 L58 85 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
                        <path d="M32 62 C32 45 42 38 50 38 C58 38 68 45 68 62 C68 68 60 70 50 70 C40 70 32 68 32 62 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
                        <rect x="42" y="46" width="16" height="18" rx="4" fill="#0369a1" stroke="#bae6fd" stroke-width="1.5"/>
                        <circle cx="50" cy="55" r="5" fill="#38bdf8" class="animate-pulse-glow"/>
                        <ellipse cx="50" cy="36" rx="14" ry="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
                        <ellipse cx="50" cy="28" rx="10" ry="3.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
                        <ellipse cx="50" cy="20" rx="7" ry="2.5" fill="#bae6fd" stroke="#ffffff" stroke-width="1"/>
                        <path d="M46 20 L44 10 L56 10 L54 20 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
                        <circle cx="50" cy="9" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
                    </svg>
                </div>
            </div>

        </div>

    </div>

    <script src="main.js"></script>
    <script>
        // Start auto-blast on load for standalone demo
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const btn = document.getElementById('auto-blast-btn');
                if (btn) btn.click();
            }, 500);
        });
    </script>
</body>
</html>
